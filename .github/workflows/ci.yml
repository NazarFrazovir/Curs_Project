name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# новий пуш у той самий PR/гілку скасовує попередній незавершений запуск
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------- 1. Збірка, лінт і тести кожного сервісу ----------
  build-test:
    name: Build & test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # падіння одного сервісу не скасовує інші
      matrix:
        include:
          - service: web
            path: "last – копія"
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python (з кешем pip)
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.path }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff==0.16.10

      - name: Build
        # перевірка, що весь код компілюється і застосунок збирається (без БД)
        run: |
          python -m compileall -q .
          DATABASE_URL= python -c "from app import create_app; create_app(); print('app factory OK')"

      - name: Lint (Ruff)
        # --output-format=github показує порушення прямо в PR (вкладка Files changed)
        run: ruff check . --output-format=github

      - name: Test
        run: pytest -v --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-${{ matrix.service }}
          path: ${{ matrix.path }}/pytest-report.xml

  # ---------- 2. Образи: збірка + сканування, публікація лише на push ----------
  image:
    name: Image (${{ matrix.service }})
    needs: build-test             # стартує лише після успішних збірки й тестів
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write             # для публікації в ghcr.io через GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            path: "last – копія"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Image name
        id: name
        # ghcr.io вимагає нижній регістр: NazarFrazovir/Curs_Project -> nazarfrazovir/curs_project
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta (теги)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (локально, без публікації)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.path }}
          load: true
          push: false
          tags: ${{ steps.name.outputs.image }}:ci-scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image (Trivy)
        # закріплено на commit SHA тегу v0.36.0 — захист від підміни тегу
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ steps.name.outputs.image }}:ci-scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"          # знайдені вразливості -> крок падає (блокує публікацію)

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.path }}
          platforms: linux/amd64,linux/arm64     # arm64 — щоб образ працював на Mac з Apple Silicon
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
