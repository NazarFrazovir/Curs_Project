name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# новий пуш у той самий PR/гілку скасовує попередній незавершений запуск
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------- 1. Збірка, лінт і тести кожного сервісу ----------
  build-test:
    name: Build & test (${{ matrix.service }})
    runs-on: ubuntu-latest
    # PostgreSQL для інтеграційних тестів ЛР4 (tests/gdpr): схема створюється з sql/*.sql
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wholesale_test
          POSTGRES_HOST_AUTH_METHOD: trust   # одноразова БД раннера, паролі не потрібні
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d wholesale_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/wholesale_test
    strategy:
      fail-fast: false            # падіння одного сервісу не скасовує інші
      matrix:
        include:
          - service: web
            path: "last – копія"
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python (з кешем pip)
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.path }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff==0.16.10

      - name: Build
        # перевірка, що весь код компілюється і застосунок збирається (без БД)
        run: |
          python -m compileall -q .
          DATABASE_URL= python -c "from app import create_app; create_app(); print('app factory OK')"

      - name: Lint (Ruff)
        # --output-format=github показує порушення прямо в PR (вкладка Files changed)
        run: ruff check . --output-format=github

      - name: Test
        run: pytest -v --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-${{ matrix.service }}
          path: ${{ matrix.path }}/pytest-report.xml

  # ---------- 1b. ЛР5: метрики якості в ізольованому, відтворюваному середовищі ----------
  quality-metrics:
    name: Quality metrics (pinned tools, limited container)
    runs-on: ubuntu-24.04          # фіксований образ раннера замість «плаваючого» ubuntu-latest
    container:
      image: python:3.11-slim-bookworm   # та сама версія, що в Dockerfile і Dockerfile.quality
      # жорсткі ліміти: результати не залежать від того, скільки ресурсів «вільно» на раннері
      options: --cpus 2 --memory 2g --memory-swap 2g
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      DATABASE_URL: ""             # тести без реальної БД
      # Шлях передаємо через змінну й робимо cd у кожному кроці: у container-джобах раннер
      # передає defaults.run.working-directory у `docker exec -w` без лапок, і назва
      # з пробілами ("last – копія") ламає команду ("No such container: –").
      APP_DIR: "last – копія"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned quality tools (lock-файл з хешами, лише wheel-пакети)
        run: |
          cd "$APP_DIR"
          pip install --no-cache-dir --require-hashes --only-binary :all: -r requirements-quality.lock

      - name: Text hygiene (UTF-8 без BOM, LF)
        # невалідне кодування ламає radon/complexipy і «покращує» ruff — зупиняємо до збору метрик
        run: |
          cd "$APP_DIR"
          python scripts/check_text_hygiene.py .

      - name: Static metrics + gate (CCN, Cognitive)
        # ratchet: пороги = поточний baseline (privacy/sanitizer.py::redact — CCN 24, Cognitive 28);
        # після рефакторингу redact() знижуємо до 15 / 15
        run: |
          cd "$APP_DIR"
          python scripts/collect_metrics.py --out results/metrics.json --max-ccn 25 --max-cognitive 30

      - name: Coverage (resilience, api)
        run: |
          cd "$APP_DIR"
          coverage run --branch --source=resilience,api -m pytest -q tests/test_resilience.py tests/test_resilience_contract.py
          coverage json -o results/coverage.json
          coverage report

      - name: Mutation testing (mutmut)
        run: |
          cd "$APP_DIR"
          mutmut run --max-children 2
          mutmut export-cicd-stats

      - name: Balanced Quality Gate (Coverage AND Mutation Score)
        run: |
          cd "$APP_DIR"
          python scripts/balanced_gate.py --coverage results/coverage.json \
            --mutation mutants/mutmut-cicd-stats.json --min-coverage 80 --min-mutation 65

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-metrics
          path: |
            last – копія/results/metrics.json
            last – копія/results/coverage.json
            last – копія/mutants/mutmut-cicd-stats.json

  # ---------- 2. Образи: збірка + сканування, публікація лише на push ----------
  image:
    name: Image (${{ matrix.service }})
    needs: build-test             # стартує лише після успішних збірки й тестів
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write             # для публікації в ghcr.io через GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            path: "last – копія"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Image name
        id: name
        # ghcr.io вимагає нижній регістр: NazarFrazovir/Curs_Project -> nazarfrazovir/curs_project
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta (теги)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (локально, без публікації)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.path }}
          load: true
          push: false
          tags: ${{ steps.name.outputs.image }}:ci-scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image (Trivy)
        # закріплено на commit SHA тегу v0.36.0 — захист від підміни тегу
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ steps.name.outputs.image }}:ci-scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"          # знайдені вразливості -> крок падає (блокує публікацію)

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.path }}
          platforms: linux/amd64,linux/arm64     # arm64 — щоб образ працював на Mac з Apple Silicon
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
