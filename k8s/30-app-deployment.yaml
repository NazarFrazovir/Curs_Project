apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: curs-project
  labels:
    app: web
    app.kubernetes.io/part-of: curs-project
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0       # під час оновлення завжди лишається 2 готові репліки
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/part-of: curs-project
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: web
          # Образ збирає CI (git-тег v1.0.0 -> тег 1.0.0). Без тегу latest.
          image: ghcr.io/nazarfrazovir/curs_project/web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: curs-config      # DB_*, LOG_*, POSTGRES_*
            - secretRef:
                name: curs-secret      # SECRET_KEY, DATABASE_URL, POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz            # 200 лише коли відповідає БД
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz           # процес живий, БД не перевіряється
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
