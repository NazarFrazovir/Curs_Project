apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: curs-project
  labels:
    app: web
    app.kubernetes.io/part-of: curs-project
spec:
  type: NodePort              # всередині кластера (web:80) і з хоста (minikube service / NodePort)
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
