# Навчальні значення. Це НЕ реальні паролі: для лабораторної в minikube.
# DATABASE_URL має узгоджуватись із POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB та Service "postgres".
apiVersion: v1
kind: Secret
metadata:
  name: curs-secret
  namespace: curs-project
  labels:
    app.kubernetes.io/part-of: curs-project
type: Opaque
stringData:
  POSTGRES_PASSWORD: lab-only-db-password
  SECRET_KEY: lab-only-flask-secret-key
  DATABASE_URL: postgresql://postgres:lab-only-db-password@postgres:5432/wholesale_db
