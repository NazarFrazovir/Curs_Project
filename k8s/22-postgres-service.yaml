apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: curs-project
  labels:
    app: postgres
    app.kubernetes.io/part-of: curs-project
spec:
  type: ClusterIP             # БД доступна лише всередині кластера
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
