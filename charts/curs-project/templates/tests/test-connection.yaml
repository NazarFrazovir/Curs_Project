{{- if .Values.tests.enabled }}
# Тест релізу: helm test <реліз> -n <namespace>
# Звертається до Service застосунку зсередини кластера й перевіряє /readyz (потрібна живa БД).
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "curs-project.fullname" . | trunc 46 | trimSuffix "-" }}-test-connection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "curs-project.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: ["sh", "-c", "wget -qO- http://{{ include "curs-project.webName" . }}:{{ .Values.service.port }}{{ .Values.web.probes.readiness.path }}"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
{{- end }}
