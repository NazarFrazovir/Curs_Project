{{- if not .Values.secrets.existingSecret }}
# Якщо задано secrets.existingSecret, чарт Secret не створює (GitOps: паролів у Git немає).
# Значення беруться зі значень чарта (values / --set), у шаблоні паролів немає.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "curs-project.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "curs-project.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s" (.Values.database.user | urlquery) (.Values.secrets.postgresPassword | urlquery) (include "curs-project.dbName" .) .Values.database.port .Values.database.name | quote }}
{{- end }}
