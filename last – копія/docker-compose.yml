services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wholesale_db}
      POSTGRES_USER: ${POSTGRES_USER:-wholesale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wholesale}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  web:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev_secret_change_me}
      DATABASE_URL: postgresql://${POSTGRES_USER:-wholesale}:${POSTGRES_PASSWORD:-wholesale}@db:5432/${POSTGRES_DB:-wholesale_db}
      HOST: 0.0.0.0
      PORT: 5000
    ports:
      - "5050:5000"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

volumes:
  pg_data:

networks:
  backend:
    driver: bridge