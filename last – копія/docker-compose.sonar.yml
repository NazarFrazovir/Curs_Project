# DEPRECATED (ADR-0004, 2026-11-02): локальний SonarQube замінено на SonarCloud + метрики в CI.
# Залишено для відтворення ЛР1. Не використовувати для нових вимірювань.
services:
  sonarqube:
    image: sonarqube:community
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs: